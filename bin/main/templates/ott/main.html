    <th:block layout:fragment="script">
        <script th:inline="javascript">
        /*<![CDATA[*/
			// 페이지가 로드되었을 때, 딱 한 번만 함수를 실행
            window.onload = () => {
                setQueryStringParams();
                findAllOtt();
            }
			
            // 쿼리 스트링 파라미터 고정
            function setQueryStringParams(){
            	if (!location.search) {
                    return false;
                }
            	//검색 폼 변수 설정
            	const form = document.getElementById('searchForm');
            	
            	// 현재URL의 쿼리 스트링을 객체화(value, key)한 후 => 검색 유형(searchType)과 키워드(keyword)의 값을 searchForm에 세팅
            	new URLSearchParams(location.search).forEach((value, key) => {
            		if (form[key]) {
            			form[key].value = value;
            		}
            	})
            }

            // 게시글 리스트 조회
            function findAllOtt() {

                // 1. PagingResponse의 멤버인 List<T> 타입의 list를 의미
                const list = [[ ${response.list} ]];

                // 2. 리스트가 비어있는 경우, 행에 "검색 결과가 없다"는 메시지를 출력하고, 페이지 번호(페이지네이션) HTML을 제거(초기화)한 후 로직을 종료
                if ( !list.length ) {
                    document.getElementById('list').innerHTML = '<td colspan="6"><div className="no_data_msg">검색된 결과가 없습니다.</div></td>';
                    drawPage();
                }

                // 3. PagingResponse의 멤버인 pagination을 의미
                const pagination = [[ ${response.pagination} ]];

                // 4. @ModelAttribute를 이용해서 뷰(HTML)로 전달한 SearchDto 타입의 객체인 params를 의미
                const params = [[ ${params} ]];

                // 5. 리스트에 출력되는 게시글 번호를 처리하기 위해 사용되는 변수 (리스트에서 번호는 페이지 정보를 이용해서 계산해야 함)
                let num = pagination.totalRecordCount - ((params.page - 1) * params.recordSize);

                // 6. 리스트 데이터 렌더링
                drawList(list, num);

                // 7. 페이지 번호 렌더링
                drawPage(pagination, params);
            }


            // 리스트 HTML draw
            function drawList(list, num) {

                // 1. 렌더링 할 HTML을 저장할 변수
                let html = '';

                /*
                 * 2. 기존에 타임리프(Thymeleaf)를 이용해서 리스트 데이터를 그리던 것과 유사한 로직
                 *    기존에는 게시글 번호를 (전체 데이터 수 - loop의 인덱스 번호)로 처리했으나,
                 *	  현재는 (전체 데이터 수 - ((현재 페이지 번호 - 1) * 페이지당 출력할 데이터 개수))로 정밀히 계산
                 */
                list.forEach(row => {
                    html += `
                        <article class="mr-12 flex flex-col w-64 min-w-72">
                            <div class="flex items-center justify-between text-xs">
                                <time datetime="${dayjs(row.createdDate).format('YYYY-MM-DD')}" class="text-gray-500">${dayjs(row.createdDate).format('YYYY-MM-DD')}</time>
                                <a href="#" class="rounded-full bg-gray-50 px-3 py-1.5 font-medium text-gray-600 hover:bg-gray-100">${row.platform}</a>
                            </div>
                            <div class="group relative mt-2">
                                <a href="javascript:void(0);" onclick="goViewPage(${row.id});">
                                    <div class="flex items-end gap-x-3">
                                        <img src="${row.thumbnail}" alt="" class="w-16 h-20 rounded bg-gray-50">
                                        <h3 class="mt-3 px-2 text-lg/6 font-semibold text-gray-900 group-hover:text-gray-600">
                                            ${row.title}
                                        </h3>
                                    </div>
                                </a>
                                <p class="mt-5 line-clamp-3 text-sm/6 text-gray-600">${row.review}</p>
                            </div>
                        </article>
                    `;
                })

                // 3. id가 "list"인 요소를 찾아 HTML을 렌더링
                document.getElementById('list').innerHTML = html;
            }
            
         	// 게시글 상세 페이지로 이동
            function goViewPage(id) {
      			// 검색 쿼리스트링이 있는지 ? 쿼리스트링 고정&id : id만 
		        const queryString = (location.search) ? location.search + `&id=${id}` : `?id=${id}`;
		        location.href = '/ott/view.do' + queryString;
		    }


            // 페이지 HTML draw
            function drawPage(pagination, params) {

                // 1. 필수 파라미터가 없는 경우, 페이지 번호(페이지네이션) HTML을 제거(초기화)한 후 로직 종료
                if ( !pagination || !params ) {
                    document.querySelector('.paging').innerHTML = '';
                    throw new Error('Missing required parameters...');
                }

                // 2. 렌더링 할 HTML을 저장할 변수
                let html = '<nav aria-label="Page navigation example">';
                	html += '<ul class="pagination justify-content-center">';

                // 3. 이전 페이지가 있는 경우, 즉 시작 페이지(startPage)가 1이 아닌 경우 첫 페이지 버튼과 이전 페이지 버튼을 HTML에 추가
                if (pagination.existPrevPage) {
                    html += `
                    	<li class="page-item"><a href="javascript:void(0);" onclick="movePage(1)" class="page-link">첫 페이지</a></li>
                    	<li class="page-item"><a href="javascript:void(0);" onclick="movePage(${pagination.startPage - 1})" class="page-link" aria-label="Previous">&laquo;</a></li>
                    `;
                }

                /*
                 * 4. 시작 페이지(startPage)와 끝 페이지(endPage) 사이의 페이지 번호(i)를 넘버링 하는 로직
                 *    페이지 번호(i)와 현재 페이지 번호(params.page)가 동일한 경우, 페이지 번호(i)를 활성화(on) 처리
                 */
                for (let i = pagination.startPage; i <= pagination.endPage; i++) {
                    html += (i == params.page)
                        ? `<li class="page-item active"><a class="page-link" href="javascript:void(0);" onclick="movePage(${i});">${i}</a></li>`
                        : `<li class="page-item"><a class="page-link" href="javascript:void(0);" onclick="movePage(${i});">${i}</a></li>`
                }

                // 5. 현재 위치한 페이지 뒤에 데이터가 더 있는 경우, 다음 페이지 버튼과 끝 페이지 버튼을 HTML에 추가
                if (pagination.existNextPage) {
                    html += `
                    	<li class="page-item"><a href="javascript:void(0);" onclick="movePage(${pagination.endPage + 1});" class="page-link" aria-label="Next">&raquo;</a></li>
                    	<li class="page-item"><a href="javascript:void(0);" onclick="movePage(${pagination.totalPageCount});" class="page-link">마지막 페이지</a></li>
                    `;
                }

                // 6. class가 "paging"인 요소를 찾아 HTML을 렌더링
                document.querySelector('.paging').innerHTML = html;
            }


            // 페이지 이동
            function movePage(page) {
				
            	// 1. 검색 폼
                const form = document.getElementById('searchForm');
            	 
             	// 2. drawPage( )의 각 버튼에 선언된 onclick 이벤트를 통해 전달받는 page(페이지 번호)를 기준으로 객체 생성
                const queryParams = {
                    page: (page) ? page : 1,
                    recordSize: 10,
                    pageSize: 5,
                    searchType: form.searchType.value,
                    keyword: form.keyword.value
                }

                /*
                 * 3. location.pathname : 리스트 페이지의 URI("/post/list.do")를 의미
                 *    new URLSearchParams(queryParams).toString() : queryParams의 모든 프로퍼티(key-value)를 쿼리 스트링으로 변환
                 *    URI + 쿼리 스트링에 해당하는 주소로 이동
                 *    (해당 함수가 리턴해주는 값을 브라우저 콘솔(console)에 찍어보시면 쉽게 이해하실 수 있습니다.)
                 */
                location.href = location.pathname + '?' + new URLSearchParams(queryParams).toString();
            }
        /*]]>*/
        </script>
